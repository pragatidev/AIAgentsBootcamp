# Postgres with pgvector for Section 23. The dataflow service is the
# Section 43 ship stub. Clone and pytest do not start Docker.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dataflow
      POSTGRES_PASSWORD: dataflow
      POSTGRES_DB: dataflow
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

  dataflow:
    profiles: ["ship"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATAFLOW_CHECKPOINTER: postgres
      DATAFLOW_PG_URL: postgresql://dataflow:dataflow@postgres:5432/dataflow
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
    env_file:
      - path: .env
        required: false
    depends_on:
      - postgres

volumes:
  pgvector_data:
